[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyp-activity-cliff-explorer"
version = "1.0.0"
description = "Interactive marimo notebook exploring CYP3A4 Activity Cliffs"
authors = [
    {name = "Mohit Upadhyay"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["cheminformatics", "drug-discovery", "activity-cliffs", "marimo", "rdkit", "machine-learning"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]

dependencies = [
    "marimo>=0.23.2",
    "rdkit>=2023.9.1",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "datasets>=2.14.0",
    "scikit-learn>=1.3.0",
    "altair>=5.0.0",
    "pillow>=10.0.0",
    "anywidget>=0.9.0",
    "wigglystuff>=0.3.0",
    "marimo-chem-utils"
]

[project.urls]
Homepage = "https://github.com/Mohit5Upadhyay/cyp-activity-cliff-explorer-molab"
Documentation = "https://github.com/Mohit5Upadhyay/cyp-activity-cliff-explorer-molab/blob/main/README.md"
Repository = "https://github.com/Mohit5Upadhyay/cyp-activity-cliff-explorer-molab"
"Bug Tracker" = "https://github.com/Mohit5Upadhyay/cyp-activity-cliff-explorer-molab/issues"
